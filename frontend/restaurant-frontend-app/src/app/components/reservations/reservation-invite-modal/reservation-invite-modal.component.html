<app-modal title="Reservation Confirmed" (closed)="onClose()">
  <dl class="info">
    <div class="info-row">
      <dt>Location</dt>
      <dd>{{ reservation().locationAddress }}</dd>
    </div>
    <div class="info-row">
      <dt>Date</dt>
      <dd>{{ reservation().startTime | date: 'MMM d, y' }}</dd>
    </div>
    <div class="info-row">
      <dt>Time</dt>
      <dd>
        {{ reservation().startTime | date: 'HH:mm' }} - {{ reservation().endTime | date: 'HH:mm' }}
      </dd>
    </div>
    <div class="info-row">
      <dt>Guests</dt>
      <dd>{{ guestsLabel() }}</dd>
    </div>
  </dl>

  @if (showInviteField()) {
    <div class="invite">
      <hr class="divider" />
      <app-invite-link-panel [reservationId]="reservation().id" />
    </div>
  }

  <div modal-actions class="actions">
    <button type="button" class="button button--secondary button--full-width view-reservation-btn" (click)="onViewReservation()">
      View Reservation
    </button>
    <button type="button" class="button button--primary button--full-width pre-order-btn" (click)="onMakePreOrder()">Make Pre-Order</button>
  </div>
</app-modal>
